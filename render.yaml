services:
  - type: web
    name: notarix-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: APP_URL
        sync: false
      - key: CLIENT_APP_URL
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: notarix
      - key: SUPER_ADMIN_NAME
        value: Notarix Super Admin
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: BANK_INFO_ENCRYPTION_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SOCKET_CORS_ORIGIN
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: AUTH_RATE_LIMIT_MAX
        value: 25
      - key: API_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: API_RATE_LIMIT_MAX
        value: 300
      - key: EMAIL_PROVIDER
        value: gmail
      - key: AWS_SES_REGION
        value: us-east-1
      - key: AWS_SES_FROM_EMAIL
        sync: false
      - key: AWS_SES_REPLY_TO
        sync: false
      - key: EMAIL_FROM_NAME
        value: Notarix
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_WORKER_DISABLED
        value: "false"
      - key: EMAIL_WORKER_INTERVAL_MS
        value: "5000"
      - key: EMAIL_WORKER_BATCH_SIZE
        value: "10"
      - key: EMAIL_WORKER_MAX_ATTEMPTS
        value: "3"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
